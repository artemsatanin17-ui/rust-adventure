
name: Rust Adventure - source check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          mkdir extracted
          unzip Rust_Adventure_7_1_Balanced_Android_Source.zip -d extracted
          cp -a extracted/Rust_Adventure_7_1_Balanced/. .

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check project
        run: cargo check --all-targets
        
